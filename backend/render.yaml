# Render Blueprint Infrastructure as Code for ReportIQ Backend
services:
  - type: web
    name: reportiq-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npx prisma db push && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: USE_MOCK_EMAIL
        value: "true"
      - key: USE_MOCK_STORAGE
        value: "true"
